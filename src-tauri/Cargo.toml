[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness 桌面端（Tauri 2 外壳，仅 Windows 11）"
authors = ["DeepSeek"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
