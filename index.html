<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness 桌面端</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app">
    <!-- 唯一控制行：品牌 + 状态 + 启停 + 窗口按钮 -->
    <header class="topbar" data-tauri-drag-region>
      <div class="tb-left" data-tauri-drag-region>
        <img class="brand-dot" data-tauri-drag-region src="./src/brand-icon.png" alt="鲸鱼娘" draggable="false" />
      </div>
      <div class="tb-status" data-tauri-drag-region>
        <span id="status-dot" class="status-dot stopped" data-tauri-drag-region></span>
        <span id="status-text" data-tauri-drag-region>服务已停止</span>
      </div>
      <div class="tb-right">
        <button id="btn-toggle" class="btn-toggle start" title="启动 / 停止 dsh web 服务">启动服务</button>
        <div class="win-controls">
          <button id="btn-min" class="tb-btn" title="最小化" aria-label="最小化">
            <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1.1"/></svg>
          </button>
          <button id="btn-max" class="tb-btn" title="最大化/还原" aria-label="最大化">
            <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.6" y="0.6" width="8.8" height="8.8" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
          </button>
          <button id="btn-close" class="tb-btn tb-close" title="关闭到托盘" aria-label="关闭到托盘">
            <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.1"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.1"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- 细条横幅：仅在异常/提示时出现 -->
    <div id="banner" class="banner hidden">
      <span id="banner-text"></span>
      <code id="banner-cmd" class="hidden"></code>
      <button id="btn-retry" class="banner-btn hidden">重试</button>
    </div>

    <!-- Web 界面主导区 -->
    <main class="web-area">
      <div class="web-frame-wrap">
        <iframe id="web-frame" class="hidden" title="DeepSeek Harness Web UI"></iframe>
        <div id="web-placeholder" class="web-placeholder">
          <p>服务启动后，Harness Web 界面会显示在这里</p>
        </div>
      </div>
    </main>
  </div>
  <script src="./src/main.js"></script>
</body>
</html>
